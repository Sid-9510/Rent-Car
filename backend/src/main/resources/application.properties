spring.application.name=RentCar

# Server Port
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentcar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:RentCarSuperSecretKeyForJwtAuthentication2026SecureTokenGenerationKey}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Application Business Configuration
app.tax-rate=${APP_TAX_RATE:0.18}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
